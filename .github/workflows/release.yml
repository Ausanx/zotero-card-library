name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ZCL_UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/release/update.json
      ZCL_XPI_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/zotero-card-library.xpi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm test
      - run: npm run build
      - run: npm run verify:package
      - run: git archive --format=zip --output=.scaffold/build/source.zip HEAD
      - name: Publish version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .scaffold/build/*.xpi .scaffold/build/source.zip --verify-tag --latest --generate-notes
      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view release || gh release create release --latest=false --prerelease --title "Plugin update manifest" --notes "Zotero update metadata"
          gh release upload release .scaffold/build/update.json --clobber
